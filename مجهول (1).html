<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>مجهول</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link id="fonts" rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600&family=Reem+Kufi:wght@500;700&display=swap">
<style id="app-style">
/* Layout: متجر ملابس. هيرو فيه حلقة 3D تدور (قطع معلقة حوالين المحور) + شبكة منتجات بتميل مع المؤشر. لوحة أدمن جانبية. */
:root{
  --bg:#e9e6de; --surface:#f6f4ee; --raise:#ffffff; --ink:#15171c; --muted:#5b5e66; --line:#cdc9bd;
  --accent:#2c49cf; --accent-ink:#ffffff; --danger:#b3261e; --ok:#1f7a4d;
  --shadow:0 18px 40px -18px rgba(20,22,30,.45);
  --f-display:'Reem Kufi','Cairo','Segoe UI',Tahoma,system-ui,sans-serif;
  --f-body:'IBM Plex Sans Arabic','Segoe UI',Tahoma,system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f1115; --surface:#171a20; --raise:#1e222a; --ink:#ecebe6; --muted:#9a9ea8; --line:#2b303a;
  --accent:#8a9dff; --accent-ink:#0c1030; --danger:#ff8a80; --ok:#6fd6a0;
  --shadow:0 18px 40px -18px rgba(0,0,0,.85); color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#0f1115; --surface:#171a20; --raise:#1e222a; --ink:#ecebe6; --muted:#9a9ea8; --line:#2b303a;
  --accent:#8a9dff; --accent-ink:#0c1030; --danger:#ff8a80; --ok:#6fd6a0;
  --shadow:0 18px 40px -18px rgba(0,0,0,.85); color-scheme:dark;}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.65;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--bg)}
button,input,select{font:inherit;color:inherit}
h1,h2,h3{margin:0;font-family:var(--f-display);font-weight:700;line-height:1.15}
p{margin:0}
a{color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.gut{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));max-width:1200px;margin-inline:auto}
.page-bg{position:fixed;inset:0;z-index:0}
.page-bg::after{content:"";position:absolute;inset:0;background:var(--bg);opacity:var(--veil,0)}
.page{position:relative;z-index:1}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.5rem;min-height:42px;padding:.55rem 1.1rem;border-radius:10px;border:1px solid var(--line);background:var(--raise);font-weight:600;cursor:pointer;text-decoration:none;transition:transform .15s,background .15s}
.btn:hover{transform:translateY(-1px)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.small{min-height:36px;padding:.3rem .8rem;font-size:.9rem}
.btn.ghost{background:transparent}
.btn.danger{background:var(--danger);border-color:var(--danger);color:var(--bg)}
.btn[disabled]{opacity:.5;cursor:not-allowed;transform:none}
.icon-btn{display:inline-grid;place-items:center;width:42px;height:42px;border-radius:50%;border:1px solid var(--line);background:var(--raise);cursor:pointer}
.icon-btn svg{display:block}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;background:color-mix(in srgb,var(--bg) 86%,transparent);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.top .gut{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:60px}
.brand{font-family:var(--f-display);font-weight:700;font-size:1.45rem;text-decoration:none}
.top nav{display:flex;align-items:center;gap:8px}
.top nav a.link{padding:.4rem .8rem;text-decoration:none;font-weight:500;color:var(--muted)}
.top nav a.link:hover{color:var(--ink)}

/* hero */
.hero{position:relative;overflow:clip;padding-block:28px 24px}
.hero-bg{position:absolute;inset:0;will-change:transform}
.hero-bg::after{content:"";position:absolute;inset:0;background:linear-gradient(to bottom,transparent 55%,var(--bg))}
.hero-in{position:relative;display:grid;grid-template-columns:minmax(0,1fr);gap:20px;align-items:center}
.hero-card{padding:24px;border-radius:18px;background:color-mix(in srgb,var(--surface) 84%,transparent);backdrop-filter:blur(10px);border:1px solid var(--line);display:flex;flex-direction:column;gap:14px;align-items:flex-start;animation:rise .7s both}
.eyebrow{font-size:.95rem;font-weight:600;color:var(--accent)}
.hero h1{font-size:clamp(2.5rem,9vw,4.6rem);text-wrap:balance}
.lede{color:var(--muted);max-width:34ch}
.stage-wrap{min-width:0}
.stage{position:relative;perspective:1100px;display:grid;place-items:center;touch-action:pan-y;cursor:grab;user-select:none;-webkit-user-select:none}
.stage:active{cursor:grabbing}
.ring{position:relative;transform-style:preserve-3d}
.ring-item{position:absolute;inset:0;transform-style:preserve-3d}
.tile{width:100%;height:100%;display:flex;flex-direction:column;border-radius:18px;background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow);overflow:hidden;cursor:pointer}
.tile.ph{cursor:default}
.t-art{flex:1;min-height:0;display:grid;place-items:center;padding:12px;background:radial-gradient(circle at 50% 35%,color-mix(in srgb,var(--c,#888) 24%,var(--surface)),var(--surface) 72%)}
.t-art img{width:100%;height:100%;object-fit:cover;border-radius:10px;pointer-events:none}
.t-art svg{width:78%;height:auto;pointer-events:none}
.t-cap{display:flex;flex-direction:column;padding:8px 12px 10px;border-top:1px solid var(--line);font-size:.85rem;line-height:1.35}
.t-cap b{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.t-cap span{color:var(--muted)}
.stage-ctrl{display:flex;align-items:center;justify-content:center;gap:16px;margin-top:6px}
.stage-ctrl .cap{display:flex;flex-direction:column;align-items:center;min-width:0;max-width:60%;text-align:center}
.stage-ctrl .cap b{font-family:var(--f-display);font-size:1.15rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.stage-ctrl .cap span{color:var(--muted);font-size:.9rem}
.flip svg{transform:scaleX(-1)}

/* products */
.shop{padding-block:28px 56px}
.shop-head{display:flex;flex-wrap:wrap;align-items:end;justify-content:space-between;gap:12px;margin-bottom:20px}
.shop-head h2{font-size:clamp(1.8rem,5vw,2.6rem)}
.shop-head small{display:block;color:var(--muted);font-family:var(--f-body);font-weight:400;font-size:.95rem;margin-top:4px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:38px;padding:.3rem .95rem;border-radius:999px;border:1px solid var(--line);background:var(--raise);font-weight:500;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,160px),1fr));gap:18px 16px}
@media (min-width:700px){.grid{grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:26px 22px}}
.card{perspective:900px;cursor:pointer;animation:rise .55s both;animation-delay:calc(var(--i,0) * 55ms);border-radius:14px}
.card-3d{position:relative;transform-style:preserve-3d;transform:rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg));transition:transform .22s ease-out}
.art{position:relative;aspect-ratio:4/5;border-radius:14px;border:1px solid var(--line);overflow:hidden;display:grid;place-items:center;transform:translateZ(26px);background:radial-gradient(circle at 50% 35%,color-mix(in srgb,var(--c,#888) 24%,var(--surface)),var(--surface) 72%);box-shadow:var(--shadow)}
.art img{width:100%;height:100%;object-fit:cover}
.art svg{width:72%;height:auto;filter:drop-shadow(0 14px 12px rgba(0,0,0,.28))}
.art::after{content:"";position:absolute;inset:0;pointer-events:none;opacity:0;transition:opacity .2s;background:radial-gradient(circle at var(--gx,50%) var(--gy,0%),rgba(255,255,255,.3),transparent 55%)}
.card:hover .art::after{opacity:1}
.tag{position:absolute;top:10px;inset-inline-start:10px;display:flex;align-items:baseline;gap:4px;padding:.3rem .65rem .3rem .65rem;border-radius:8px;background:var(--accent);color:var(--accent-ink);font-family:var(--f-display);font-weight:700;transform:translateZ(64px);transform-origin:top center;animation:swing 4.5s ease-in-out infinite;box-shadow:0 8px 14px -8px rgba(0,0,0,.6)}
.tag::before{content:"";position:absolute;top:-6px;inset-inline-start:50%;width:8px;height:8px;margin-inline-start:-4px;border-radius:50%;background:var(--bg);border:2px solid var(--accent)}
.tag small{font-size:.72rem;font-weight:500;opacity:.85}
.card h3{margin-top:12px;font-family:var(--f-body);font-weight:600;font-size:1.02rem;line-height:1.4;transform:translateZ(14px)}
.card .cat{color:var(--muted);font-size:.88rem}
.empty{padding:48px 20px;border:1px dashed var(--line);border-radius:14px;text-align:center;color:var(--muted);display:flex;flex-direction:column;gap:14px;align-items:center}

.sizes{display:flex;flex-wrap:wrap;gap:8px}
.size{min-width:46px;min-height:40px;padding:.2rem .75rem;border-radius:10px;border:1px solid var(--line);background:var(--raise);font-weight:600;cursor:pointer}
.size[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.m-lab{font-weight:600;font-size:.95rem}
.vh{position:absolute;width:1px;height:1px;opacity:0;overflow:hidden}
footer{border-top:1px solid var(--line);padding-block:24px;color:var(--muted);font-size:.92rem}
footer .gut{display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px}

/* product modal */
.modal{position:fixed;inset:0;z-index:100;display:grid;place-items:center;padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));background:rgba(10,12,16,.62);backdrop-filter:blur(6px);animation:fade .2s both}
.m-box{position:relative;display:grid;grid-template-columns:minmax(0,1fr);width:100%;max-width:880px;max-height:100%;overflow:auto;background:var(--surface);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow)}
@media (min-width:760px){.m-box{grid-template-columns:minmax(0,1.05fr) minmax(0,1fr)}}
.m-art{perspective:1000px;padding:20px;display:grid;place-items:center}
.m-3d{width:100%;max-width:380px;transform-style:preserve-3d;transform:rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg));transition:transform .2s ease-out}
.m-3d .art{transform:translateZ(30px)}
.m-info{padding:24px;display:flex;flex-direction:column;gap:14px;justify-content:center}
.m-info h2{font-size:clamp(1.6rem,4vw,2.2rem)}
.m-price{font-family:var(--f-display);font-weight:700;font-size:1.8rem;color:var(--accent)}
.m-meta{display:flex;flex-wrap:wrap;gap:8px 18px;color:var(--muted);font-size:.95rem;align-items:center}
.dot{display:inline-block;width:14px;height:14px;border-radius:50%;border:1px solid var(--line);vertical-align:-2px;margin-inline-end:6px}
.m-close{position:absolute;top:10px;inset-inline-end:10px;z-index:2}

/* admin drawer */
.admin{position:fixed;z-index:90;inset-block:0;inset-inline-end:0;width:min(470px,100%);display:flex;flex-direction:column;background:var(--surface);border-inline-start:1px solid var(--line);box-shadow:var(--shadow);padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px);animation:slideIn .25s both}
.adm-head{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line)}
.adm-head h2{font-size:1.4rem}
.tabs{display:flex;gap:6px;padding:10px 16px 0}
.tabs button{flex:1;min-height:40px;border:1px solid var(--line);border-bottom:none;border-radius:10px 10px 0 0;background:var(--bg);color:var(--muted);font-weight:600;cursor:pointer}
.tabs button[aria-selected="true"]{background:var(--raise);color:var(--ink)}
.adm-body{flex:1;overflow:auto;padding:16px;background:var(--raise);border-top:1px solid var(--line)}
.adm-body section{display:flex;flex-direction:column;gap:16px}
.adm-body h3{font-size:1.15rem}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.row.between{justify-content:space-between}
.form{display:flex;flex-direction:column;gap:6px;padding:14px;border:1px solid var(--line);border-radius:14px;background:var(--surface)}
.form label{font-weight:600;font-size:.92rem;margin-top:8px}
.form input:not([type=color]):not([type=file]),.form select{width:100%;min-height:44px;padding:.45rem .7rem;border-radius:10px;border:1px solid var(--line);background:var(--raise)}
.form input[type=color]{width:64px;height:40px;padding:2px;border-radius:10px;border:1px solid var(--line);background:var(--raise)}
.hint{color:var(--muted);font-size:.85rem}
.hint.err{color:var(--danger)}
.img-field{display:flex;gap:12px;align-items:center;margin-top:6px}
.thumb{width:76px;height:96px;flex:none;border-radius:10px;border:1px dashed var(--line);display:grid;place-items:center;overflow:hidden;background:var(--bg);color:var(--muted);font-size:.75rem;text-align:center}
.thumb img{width:100%;height:100%;object-fit:cover}
.thumb svg{width:70%;height:auto}
.plist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.prow{display:grid;grid-template-columns:52px minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
.prow .pt{width:52px;height:64px;border-radius:8px;overflow:hidden;display:grid;place-items:center;background:var(--bg)}
.prow .pt img{width:100%;height:100%;object-fit:cover}
.prow .pt svg{width:80%;height:auto}
.prow b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.prow span{color:var(--muted);font-size:.88rem}
.prow .acts{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.bg-pick{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:10px}
.swatch{height:56px;border-radius:10px;border:2px solid var(--line);cursor:pointer;padding:0;position:relative;overflow:hidden}
.swatch[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent)}
.swatch.up{background:var(--bg);display:grid;place-items:center;border-style:dashed;font-size:.8rem;font-weight:600;color:var(--muted)}
.adm-busy{position:absolute;inset:0;z-index:5;display:grid;place-items:center;background:color-mix(in srgb,var(--surface) 80%,transparent);font-weight:600}

.toast{position:fixed;z-index:120;inset-inline:0;bottom:max(20px,env(safe-area-inset-bottom,0px));display:flex;justify-content:center;pointer-events:none}
.toast div{padding:.6rem 1.1rem;border-radius:10px;background:var(--ink);color:var(--bg);font-weight:500;max-width:calc(100% - 32px);box-shadow:var(--shadow);animation:rise .25s both}

@media (min-width:860px){
  .hero-in{grid-template-columns:minmax(0,.85fr) minmax(0,1.15fr);gap:32px}
  .hero{padding-block:44px 32px}
}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes slideIn{from{opacity:0;transform:translateX(-28px)}to{opacity:1;transform:none}}
@keyframes swing{0%,100%{rotate:-5deg}50%{rotate:5deg}}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
}
</style>

<template id="shell">
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs><linearGradient id="shade" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".24"/><stop offset=".55" stop-color="#fff" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".3"/></linearGradient></defs></svg>
<div class="page-bg" id="pageBg"></div>
<div class="page">
  <header class="top"><div class="gut">
    <a class="brand" href="#top" id="brand"></a>
    <nav>
      <a class="link" href="#products">المنتجات</a>
      <button class="btn small" id="admOpen" type="button" hidden>
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l1.8 2.4 3-.4.9 2.9 2.8 1.2-.9 2.9 1.7 2.5-2.4 1.8-.1 3-3 .4L12 21l-1.8-2.4-3 .4-.9-2.9-2.8-1.2.9-2.9L2.7 9.5 5.1 7.7 5.2 4.7l3-.4z"/><circle cx="12" cy="12" r="3"/></svg>
        لوحة الأدمن
      </button>
    </nav>
  </div></header>

  <section class="hero" id="top">
    <div class="hero-bg" id="heroBg"></div>
    <div class="gut hero-in">
      <div class="hero-card">
        <p class="eyebrow" id="tagline"></p>
        <h1 id="storeName"></h1>
        <p class="lede">اسحب القطع بإصبعك أو بالماوس عشان تدوّر الحلقة، وادوس على أي قطعة تشوف تفاصيلها.</p>
        <a class="btn primary" href="#products">تصفح المنتجات</a>
      </div>
      <div class="stage-wrap">
        <div class="stage" id="stage" tabindex="0" aria-label="حلقة المنتجات. استخدم الأسهم للتنقل وزر الإدخال للفتح."><div class="ring" id="ring"></div></div>
        <div class="stage-ctrl">
          <button class="icon-btn" id="prev" type="button" aria-label="القطعة السابقة"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg></button>
          <div class="cap"><b id="capName"></b><span id="capPrice"></span></div>
          <button class="icon-btn flip" id="next" type="button" aria-label="القطعة التالية"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg></button>
        </div>
      </div>
    </div>
  </section>

  <main class="shop" id="products"><div class="gut">
    <div class="shop-head">
      <h2>المنتجات<small id="count"></small></h2>
      <div class="chips" id="chips" role="group" aria-label="تصفية حسب القسم"></div>
    </div>
    <div class="grid" id="grid"></div>
  </div></main>

  <footer><div class="gut"><span id="foot"></span><span>اسحب، لف، واختار.</span></div></footer>
</div>

<div class="modal" id="modal" hidden role="dialog" aria-modal="true" aria-labelledby="m-title">
  <div class="m-box">
    <button class="icon-btn m-close" id="mClose" type="button" aria-label="إغلاق"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
    <div class="m-art" id="mArt"><div class="m-3d" id="m3d"></div></div>
    <div class="m-info">
      <p class="eyebrow" id="mCat"></p>
      <h2 id="m-title"></h2>
      <p class="m-price" id="mPrice"></p>
      <div class="m-meta"><span><i class="dot" id="mDot"></i>اللون</span></div>
      <div id="mSizes" hidden><p class="m-lab">اختار المقاس</p><div class="sizes" id="mSizeBtns" role="group" aria-label="المقاس"></div><p class="hint err" id="mSizeErr"></p></div>
      <div class="row" id="mOrder"></div>
    </div>
  </div>
</div>

<aside class="admin" id="admin" hidden aria-label="لوحة الأدمن">
  <div class="adm-head"><h2>لوحة الأدمن</h2><button class="icon-btn" id="admClose" type="button" aria-label="إغلاق اللوحة"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
  <div class="tabs" role="tablist">
    <button role="tab" id="tabP" type="button" aria-selected="true">المنتجات</button>
    <button role="tab" id="tabS" type="button" aria-selected="false">الموقع والخلفيات</button>
  </div>
  <div class="adm-body">
    <section id="paneP">
      <div class="row between"><h3 id="pcount"></h3><button class="btn small primary" id="addP" type="button">+ منتج جديد</button></div>
      <form class="form" id="pform" hidden>
        <label for="p-name">اسم المنتج</label>
        <input id="p-name" maxlength="80" autocomplete="off">

/* ---------- 3D ring ---------- */
const ring={items:[],n:0,rot:0,goal:null,vel:0,dragging:false,hover:false,step:0,R:0,idx:-1,w:0,stageW:0};
const PH=[{type:'tshirt',color:'#cdbb98'},{type:'hoodie',color:'#3b3f46'},{type:'pants',color:'#55623a'},{type:'jacket',color:'#3f5f8f'}];
function tileHtml(it){
  if(it.p){const p=it.p;return '<div class="tile" style="--c:'+col(p.color)+'"><div class="t-art">'+artHtml(p)+'</div><div class="t-cap"><b>'+esc(p.name)+'</b><span>'+esc(price(p.price))+'</span></div></div>'}
  const h=it.ph;return '<div class="tile ph" style="--c:'+h.color+'"><div class="t-art">'+garment(h.type,h.color)+'</div><div class="t-cap"><b>قريباً</b><span>قطعة جديدة</span></div></div>';
}
function buildRing(){
  const list=state.products.slice(0,8).map(p=>({p:p}));
  let k=0;while(list.length<5)list.push({ph:PH[k++%PH.length]});
  ring.items=list;ring.n=list.length;ring.step=360/ring.n;
  const sw=el.stage.clientWidth||340;ring.stageW=sw;
  const w=Math.round(Math.max(118,Math.min(200,sw*.4))),h=Math.round(w*1.3);
  ring.w=w;ring.R=Math.round(((w+20)/2)/Math.tan(Math.PI/ring.n));
  el.stage.style.height=(h+46)+'px';
  el.ring.style.width=w+'px';el.ring.style.height=h+'px';
  el.ring.innerHTML=list.map((it,i)=>'<div class="ring-item" data-i="'+i+'" style="transform:rotateY('+(i*ring.step)+'deg) translateZ('+ring.R+'px)">'+tileHtml(it)+'</div>').join('');
  ring.nodes=[].slice.call(el.ring.children);ring.idx=-1;applyRing();
}
function applyRing(){
  el.ring.style.transform='translateZ('+(-ring.R)+'px) rotateX(-7deg) rotateY('+ring.rot.toFixed(2)+'deg)';
  for(let i=0;i<ring.n;i++){
    const a=(((i*ring.step+ring.rot)%360)+360)%360;
    const c=Math.cos(a*Math.PI/180);
    const n=ring.nodes[i];
    n.style.opacity=(.25+.75*Math.pow((c+1)/2,1.2)).toFixed(2);
    n.style.pointerEvents=c>-.1?'auto':'none';
  }
  const idx=((Math.round(-ring.rot/ring.step)%ring.n)+ring.n)%ring.n;
  if(idx!==ring.idx){
    ring.idx=idx;const it=ring.items[idx];
    el.capName.textContent=it.p?it.p.name:'قريباً';
    el.capPrice.textContent=it.p?price(it.p.price):'قطعة جديدة';
  }
}

}
el.stage.addEventListener('pointerup',endDrag);

el.stage.addEventListener('keydown',e=>{

});
let visible=true;
if('IntersectionObserver' in window){new IntersectionObserver(es=>{visible=es[0].isIntersecting},{rootMargin:'120px'}).observe($('#top'))}
function tick(){
  if(visible&&!document.hidden&&ring.n){
    if(ring.dragging){}
    else if(ring.goal!==null){ring.rot+=(ring.goal-ring.rot)*.13;if(Math.abs(ring.goal-ring.rot)<.05){ring.rot=ring.goal;ring.goal=null}}

    let armed=0;
    d.addEventListener('click',()=>{
      if(!armed){armed=setTimeout(()=>{armed=0;d.textContent='حذف';d.className='btn small ghost'},3000);d.textContent='تأكيد الحذف';d.className='btn small danger';return}
      clearTimeout(armed);
      state.products=state.products.filter(x=>x.id!==p.id);
      commit('تم حذف المنتج');
    });
    acts.appendChild(e);acts.appendChild(d);A.list.appendChild(li);
  });
  A.sName.value=state.settings.name||'';A.sTag.value=state.settings.tagline||'';A.sWa.value=state.settings.whatsapp||'';
  renderPick('heroBg',$('#heroPick'));renderPick('pageBg',$('#pagePick'));
  const can=!!assetsApi;
  A.pick.hidden=!can;A.clear.hidden=!can;
  if(!can)A.msg.textContent='رفع الصور غير متاح حالياً. سيبها بدون صورة وهتظهر القطعة برسم ثلاثي الأبعاد.';
}
function thumbRender(){
  if(ID.test(adm.img)){A.thumb.innerHTML='<img src="/_blob/'+adm.img+'" alt="">'}
  else A.thumb.innerHTML=garment(A.type.value,A.color.value);
}
function renderSizePick(){
  const set=sizeSet(A.type.value);
  adm.sizes=adm.sizes.filter(s=>set.indexOf(s)>-1);
  A.sizes.innerHTML='';
  set.forEach(s=>{
    const b=document.createElement('button');b.type='button';b.className='size';b.textContent=s;
    b.setAttribute('aria-pressed',String(adm.sizes.indexOf(s)>-1));
    b.addEventListener('click',()=>{
      const i=adm.sizes.indexOf(s);
      if(i>-1)adm.sizes.splice(i,1);else adm.sizes.push(s);
      b.setAttribute('aria-pressed',String(i<0));
    });
    A.sizes.appendChild(b);
  });
}
function startForm(p){
  adm.editing=p?p.id:null;adm.img=p?(p.img||''):'';
  A.name.value=p?p.name:'';A.price.value=p&&p.price?p.price:'';
  A.type.value=p?p.type:'tshirt';A.color.value=p?col(p.color):'#3b3f46';
  adm.sizes=p&&Array.isArray(p.sizes)?p.sizes.slice():[];renderSizePick();
  A.msg.textContent='';A.msg.className='hint';A.file.value='';
  A.form.hidden=false;thumbRender();
  A.form.scrollIntoView({block:'nearest',behavior:RM?'auto':'smooth'});
  A.name.focus();
}
A.type.addEventListener('change',()=>{renderSizePick();if(!ID.test(adm.img))thumbRender()});
A.color.addEventListener('input',()=>{if(!ID.test(adm.img))thumbRender()});
$('#addP').addEventListener('click',()=>startForm(null));
$('#p-cancel').addEventListener('click',()=>{A.form.hidden=true});
A.clear.addEventListener('click',()=>{adm.img='';thumbRender();A.msg.textContent='تم إزالة الصورة. اضغط حفظ المنتج لتثبيت التغيير.';A.msg.className='hint'});

async function shrink(file,max){
  try{
    const bmp=await createImageBitmap(file);
    const s=Math.min(1,max/Math.max(bmp.width,bmp.height));
    const w=Math.round(bmp.width*s),h=Math.round(bmp.height*s);
    const c=document.createElement('canvas');c.width=w;c.height=h;
    c.getContext('2d').drawImage(bmp,0,0,w,h);
    const blob=await new Promise(r=>c.toBlob(r,'image/webp',.88));
    if(blob&&blob.size&&blob.size<file.size*1.2)return blob;
  }catch(_){}
  return file;
}
function upErr(e){
  const c=e&&e.code;
  if(c==='too_large')return 'الصورة كبيرة جداً.';
  if(c==='unsupported_type')return 'نوع الملف غير مدعوم. استخدم JPG أو PNG أو WebP.';
  if(c==='quota_or_state')return 'مساحة التخزين امتلأت.';
  if(c==='rate_limited')return 'استنى شوية وجرّب تاني.';
  return 'تعذر رفع الصورة. جرّب تاني.';
}
async function uploadFile(file,max){
  const blob=await shrink(file,max);
  return assetsApi.upload(blob);
}
A.file.addEventListener('change',async()=>{
  const f=A.file.files&&A.file.files[0];if(!f||!assetsApi)return;
  adm.uploading=true;A.save.disabled=true;A.msg.className='hint';A.msg.textContent='جاري رفع الصورة…';
  try{const r=await uploadFile(f,1400);adm.img=r.id;thumbRender();A.msg.textContent='تم رفع الصورة. اضغط حفظ المنتج.'}
  catch(e){A.msg.className='hint err';A.msg.textContent=upErr(e)}
  adm.uploading=false;A.save.disabled=false;A.file.value='';
});
A.form.addEventListener('submit',e=>{
  e.preventDefault();
  const name=A.name.value.trim();
  if(!name){A.msg.className='hint err';A.msg.textContent='اكتب اسم المنتج.';A.name.focus();return}
  const pr=parseFloat(A.price.value);
  if(A.price.value!==''&&!(pr>=0)){A.msg.className='hint err';A.msg.textContent='السعر لازم يكون رقم.';A.price.focus();return}
  const rec={id:adm.editing||('p'+Date.now().toString(36)),name:name,price:isFinite(pr)?pr:0,type:A.type.value,color:A.color.value,img:ID.test(adm.img)?adm.img:'',sizes:sizeSet(A.type.value).filter(s=>adm.sizes.indexOf(s)>-1)};
  if(adm.editing){state.products=state.products.map(x=>x.id===rec.id?rec:x)}else{state.products.unshift(rec)}
  commit(adm.editing?'تم تعديل المنتج':'تمت إضافة المنتج');
});
A.sform.addEventListener('submit',e=>{
  e.preventDefault();
  state.settings.name=A.sName.value.trim()||'متجري';
  state.settings.tagline=A.sTag.value.trim();
  state.settings.whatsapp=A.sWa.value.replace(/\D/g,'');
  commit('تم حفظ بيانات الموقع');
});
function renderPick(key,host){
  const cur=state.settings[key]||{};
  host.innerHTML='';
  Object.keys(PRESETS).forEach(id=>{
    const b=document.createElement('button');b.type='button';b.className='swatch';b.title=PRESETS[id].name;
    b.setAttribute('aria-label','خلفية '+PRESETS[id].name);b.style.background=PRESETS[id].css;
    b.setAttribute('aria-pressed',String(cur.kind!=='image'&&(cur.value||'twill')===id));
    b.addEventListener('click',()=>{state.settings[key]={kind:'preset',value:id};commit('تم تغيير الخلفية')});
    host.appendChild(b);
  });
  if(ID.test(cur.id||'')&&cur.kind==='image'){
    const b=document.createElement('button');b.type='button';b.className='swatch';b.title='الصورة الحالية';
    b.setAttribute('aria-label','الصورة الحالية');b.setAttribute('aria-pressed','true');
    b.style.background='url("/_blob/'+cur.id+'") center/cover';host.appendChild(b);
  }
  if(assetsApi){
    const inp=document.createElement('input');inp.type='file';inp.accept='image/*';inp.className='vh';
    const up=document.createElement('label');up.className='swatch up';up.textContent='+ صورة';up.appendChild(inp);
    inp.addEventListener('change',async()=>{
      const f=inp.files&&inp.files[0];if(!f)return;
      A.sMsg.className='hint';A.sMsg.textContent='جاري رفع الخلفية…';inp.disabled=true;
      try{const r=await uploadFile(f,2000);state.settings[key]={kind:'image',id:r.id};commit('تم تغيير الخلفية')}
      catch(err){A.sMsg.className='hint err';A.sMsg.textContent=upErr(err);inp.disabled=false;inp.value=''}
    });
    host.appendChild(up);
  }
}

/* ---------- publishing ---------- */
function buildDoc(){
  const head=document.head;
  const vm=head.querySelector('meta[name=viewport]');
  const vp=vm?vm.getAttribute('content'):'width=device-width,initial-scale=1,viewport-fit=cover';
  let reset='';
  head.querySelectorAll('style').forEach(s=>{if(!reset&&/safe-area-inset/.test(s.textContent))reset=s.textContent});
  const json=JSON.stringify(state).replace(/</g,'\\u003c').replace(new RegExp('[\\u2028\\u2029]','g'),'');
  return '<!doctype html><html><head><meta charset=utf8><meta name=viewport content="'+vp+'"><style>'+reset+'</style></head><body>'
    +'<title>'+esc(state.settings.name)+'</title>'
    +'<meta name="claude:viewport-fit-sides" content="cover">'
    +$('#fonts').outerHTML
    +'<style id="app-style">'+$('#app-style').textContent+'</style>'
    +'<template id="shell">'+$('#shell').innerHTML+'</template>'
    +'<script type="application/json" id="state">'+json+'<\/script>'
    +'<script id="app-script">'+$('#app-script').textContent+'<\/script>'
    +'</body></html>';
}
function pubErr(e){
  const c=e&&e.code;
  if(c==='conflict')return 'الموقع اتعدّل من مكان تاني. اتحدّث لآخر نسخة، جرّب تاني.';
  if(c==='not_writer'||c==='not_granted')return 'مفيش صلاحية لتعديل الموقع.';
  return 'تعذر الحفظ. جرّب تاني.';
}
let committing=false;
async function commit(msg){
  if(!canEdit||!artifactApi||committing)return;
  committing=true;el.admBusy.hidden=false;
  try{sessionStorage.setItem(SKEY,JSON.stringify({open:true,tab:adm.tab,msg:msg}))}catch(_){}
  try{
    await artifactApi.publish(buildDoc());
    setTimeout(()=>{committing=false;el.admBusy.hidden=true;toast(msg)},4000);
  }catch(e){
    committing=false;el.admBusy.hidden=true;
    try{sessionStorage.removeItem(SKEY)}catch(_){}
    toast(pubErr(e));
  }
}

/* ---------- global keys ---------- */
document.addEventListener('keydown',e=>{
  if(e.key!=='Escape')return;
  if(!el.modal.hidden)closeProduct();else if(!el.admin.hidden)closeAdmin();
});

/* ---------- start ---------- */
renderSettings();renderChips();renderGrid();buildRing();
if(!RM){ring.rot=-140;ring.goal=0}
requestAnimationFrame(tick);

const use=n=>{try{return window.claude&&window.claude.use?window.claude.use(n).catch(()=>null):Promise.resolve(null)}catch(_){return Promise.resolve(null)}};
(async function(){
  const res=await Promise.all([use('user'),use('artifact'),use('assets')]);
  const user=res[0];artifactApi=res[1];assetsApi=res[2];
  let ok=false;try{ok=!!(user&&await user.canEdit())}catch(_){}
  canEdit=ok&&!!artifactApi;
  if(!canEdit)return;
  el.admOpen.hidden=false;
  renderGrid();
  let saved=null;try{saved=JSON.parse(sessionStorage.getItem(SKEY)||'null')}catch(_){}
  if(saved){
    try{sessionStorage.removeItem(SKEY)}catch(_){}
    if(saved.open)openAdmin(saved.tab||'products');
    if(saved.msg)toast(saved.msg);
  }
})();
})();
</script>
